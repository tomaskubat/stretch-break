name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh {0}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the release tag and toolchain
        id: version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          source Scripts/release-version.sh
          resolve_release_version "$RELEASE_TAG"
          print -r -- "number=$STRETCHBREAK_VERSION" >> "$GITHUB_OUTPUT"
          [[ $(uname -m) == arm64 ]]
          xcodebuild -version
          swift --version

      - name: Check scripts, application metadata, and workflows
        run: ./Scripts/check-config.sh

      - name: Run tests
        run: |
          set -euo pipefail
          swift test --cache-path .build/cache

      - name: Build and verify release assets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            print -u2 'Set the SPARKLE_PRIVATE_KEY repository secret before releasing.'
            exit 1
          fi
          ./Scripts/build-app.sh "$RELEASE_TAG"
          ./Scripts/package-app.sh "$RELEASE_TAG"
          ./Scripts/generate-appcast.sh "$RELEASE_TAG"
          python3 Scripts/test-update-verification.py "$RELEASE_TAG"
          ./Scripts/verify-package.sh "$RELEASE_TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          cat > .build/release-notes.md <<'NOTES'
          Requires Apple Silicon and macOS 14 or later.

          Download the arm64 ZIP for the ready-to-run application and installation guide. The source ZIP contains the matching source project. SHA256SUMS.txt contains checksums for the release archives and update feed.

          Automatic updates use appcast.xml and the update ZIP. Existing versions without the updater need one manual installation. Update archives are signed with Ed25519.

          The application has an ad hoc signature. It is not Developer ID signed or notarized; macOS may require approval of the first launch in Privacy & Security.
          NOTES
          gh release create "$RELEASE_TAG" \
            "dist/StretchBreak-${RELEASE_VERSION}-arm64.zip" \
            "dist/StretchBreak-${RELEASE_VERSION}-source.zip" \
            "dist/StretchBreak-${RELEASE_VERSION}-update.zip" \
            dist/appcast.xml \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "StretchBreak $RELEASE_VERSION" \
            --notes-file .build/release-notes.md \
            --generate-notes

      - name: Verify the published release and latest update feed
        run: ./Scripts/verify-published-release.sh "$RELEASE_TAG"
